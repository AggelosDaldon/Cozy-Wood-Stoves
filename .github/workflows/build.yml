name: Compile grill integration (unified Functional Stoves)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Compile Forge integration classes
        run: gradle classes --no-daemon --stacktrace
      - name: Emit temporary compiled-patch checksum and encoded patch for local merge verification
        run: |
          cd build
          jar cf grill-compiled-patch.zip -C classes/java/main . -C resources/main .
          sha256sum grill-compiled-patch.zip
          echo "BEGIN_GRILL_PATCH_BASE64"
          base64 -w0 grill-compiled-patch.zip
          echo
          echo "END_GRILL_PATCH_BASE64"
      - name: Check original mod binary exists
        id: original
        run: |
          if test -f original/functional_stoves-1.0-SNAPSHOT.jar; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Original JAR absent; only source compilation was checked. No usable mod JAR will be uploaded."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build single original-plus-grill mod
        if: steps.original.outputs.present == 'true'
        run: gradle jar --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        if: steps.original.outputs.present == 'true'
        with:
          name: functional-stoves-with-grill
          path: build/libs/functional_stoves-1.0-SNAPSHOT-with-grill.jar
